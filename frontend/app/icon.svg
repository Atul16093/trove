<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon build of the Trove chest: an opaque accent tile with the mark
       knocked out in white, which holds up far better at 16px than a
       transparent coloured glyph. The keyhole is painted in the tile colour
       rather than masked, so every favicon renderer handles it. -->
  <rect width="32" height="32" rx="7" fill="#0A84FF"/>
  <g transform="translate(16 16) scale(0.74) translate(-16 -16)">
    <path d="M3 15v-1.5C3 8.8 8.82 5 16 5s13 3.8 13 8.5V15Z" fill="#fff"/>
    <path d="M3 15h26v7.5a4.5 4.5 0 0 1-4.5 4.5h-17A4.5 4.5 0 0 1 3 22.5Z" fill="#fff" fill-opacity="0.62"/>
    <path d="M16 11.4a3 3 0 0 1 3 3v3.2a3 3 0 1 1-6 0v-3.2a3 3 0 0 1 3-3Z" fill="#0A84FF"/>
  </g>
</svg>
